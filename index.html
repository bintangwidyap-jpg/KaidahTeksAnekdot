.field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; min-width: 0; }
label { font-weight: 600; }
textarea, input[type="text"], input[type="url"], input[type="search"], select { font: inherit; width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }

/* ===== Gaya ramah SMA (menimpa gaya dasar di atas) ===== */
body { background-color: var(--bg); background-image: radial-gradient(var(--dot) 1.4px, transparent 1.5px); background-size: 24px 24px; }
h1, h2 { letter-spacing: -.015em; }
.side { background: var(--surface); color: var(--ink); border-right: 2px solid var(--line); }
.side :focus-visible, .top :focus-visible { outline-color: var(--focus); }
.brand { border-bottom: 2px dashed var(--line); }
.logo { background: var(--soft); color: var(--primary); font-size: 1.5rem; border-radius: 14px; }
.brand small { color: var(--muted); opacity: 1; }
.ng { color: var(--primary-d); }
.side a { color: var(--ink); border-radius: 14px; }
.side a:hover { background: var(--surface2); }
.side a[aria-current="page"] { background: var(--soft); color: var(--primary-d); font-weight: 800; }
.side .em { flex: none; width: 26px; text-align: center; font-size: 1.15rem; line-height: 1; }
.side .tick { background: #22c55e; color: #fff; }
.top { background: var(--surface); color: var(--ink); border-bottom: 2px solid var(--line); }
.iconbtn { background: var(--soft); color: var(--primary-d); border-radius: 14px; }
.iconbtn:hover { background: var(--line); }
.net { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); }
body::before { background: var(--surface); }
.card { border: 2px solid var(--line); border-radius: 22px; padding: 22px; }
.hero { position: relative; overflow: hidden; border-radius: 28px; color: var(--hero-ink); background: linear-gradient(135deg, var(--hero1) 0%, var(--hero2) 100%); border: 2px solid var(--line); padding: clamp(22px, 5vw, 40px); min-height: 250px; }
.hero .eyebrow { color: var(--primary-d); }
.hero h1 { color: var(--hero-ink); max-width: 16ch; }
.hero .lead { color: var(--hero-ink); max-width: 34ch; }
.hero-in { position: relative; z-index: 1; max-width: 520px; }
.deco { position: absolute; right: 2%; top: 50%; transform: translateY(-50%); width: min(38%, 330px); pointer-events: none; }
.deco svg { width: 100%; height: auto; display: block; }
.btn { border-radius: 999px; }
.btn.primary { box-shadow: 0 3px 0 var(--primary-d); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--primary-d); }
.chip { background: var(--surface2); }
.qid { background: var(--primary); color: var(--on-primary); border-radius: 999px; }
.kn { display: inline-block; background: var(--soft); color: var(--primary-d); padding: 2px 10px; border-radius: 999px; margin-bottom: 6px; }
.kcard { border: 2px solid var(--line); border-radius: 20px; }
.teks { border-left: 0; border: 2px dashed var(--primary); border-radius: 18px; background: var(--surface2); }

.acc { border: 2px solid var(--line); border-radius: 18px; }
.tabs button { border-radius: 999px; border-width: 2px; }
.callout { border-radius: 16px; border-width: 2px; }
.sumbar { border: 2px solid var(--line); border-radius: 16px; }
.tw { border-width: 2px; border-radius: 16px; }
textarea, input[type="text"], input[type="url"], input[type="search"], select { border-radius: 14px; }
#toast { background: var(--toast); border-radius: 16px; }
.skills { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.skill { background: var(--surface2); border: 2px solid var(--line); border-radius: 18px; padding: 16px; }
.skill .big { font-size: 2rem; line-height: 1; display: block; margin-bottom: 6px; }
.skill h3 { margin: 0 0 .3em; font-size: 1.05rem; }
.skill p { margin: 0 0 .6em; font-size: .95rem; }

.upstat.ok { color: var(--ok); } .upstat.bad { color: var(--bad); }
.confetti { font-size: 1.6rem; letter-spacing: .3em; }
@media (max-width: 700px) {
  .deco { position: static; transform: none; width: min(70%, 260px); margin: 12px auto 0; }
  .hero { min-height: 0; }
}
@media (max-width: 959px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 70; left: 0; top: 0; bottom: 0; height: auto; width: min(86vw, 320px); transform: translateX(-105%); transition: transform .25s; box-shadow: 8px 0 30px rgba(20, 48, 95, .25); }
  body.navopen .side { transform: none; }
  body.navopen .scrim { display: block; position: fixed; inset: 0; background: rgba(20, 48, 95, .45); z-index: 65; }
  #menuBtn { display: grid; }
  .row2 { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  body { font-size: 16px; }
  .card { padding: 16px; border-radius: 14px; }
  .btn { width: 100%; }
  .row .btn { flex: 1 1 100%; }
  .tabs button { padding: 8px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media print {
  body::before, .side, .top, .scrim, #toast, .btn, .tabs, .skip { display: none !important; }
  .app { display: block; } .main { max-width: none; padding: 0; } .card, .tw { box-shadow: none; break-inside: avoid; }
  body { background: #fff; color: #000; }
}
.kn { display: table; }
@media (max-width: 959px) { .side { box-shadow: none; } body.navopen .side { box-shadow: 8px 0 30px rgba(20, 48, 95, .25); } }
